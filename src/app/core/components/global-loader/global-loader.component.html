@if (loadingService.isLoading()) {
  <div class="fm-overlay-fullscreen active fm-gpu-optimize">
    <div class="fm-overlay-content">
      <div class="logo-spinner-wrap">
        <div class="logo-ambient-glow"></div>
        <img src="assets/icons/logo.png" alt="FurniMind AI" class="brand-img-loader" />
      </div>
      
      <!-- Premium luxury loading animation -->
      <div class="fm-luxury-loader">
        <div class="fm-loader-particles">
          <span class="particle particle-1"></span>
          <span class="particle particle-2"></span>
          <span class="particle particle-3"></span>
        </div>
        <div class="fm-loader-scanner-track">
          <div class="fm-loader-scanner-glow"></div>
        </div>
      </div>
    </div>
  </div>
}
