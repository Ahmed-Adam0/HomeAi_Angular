<div class="auth-wrapper login-mirror" [attr.dir]="direction()" [attr.lang]="currentLang()">
  <div class="auth-form-side">
    <div class="auth-form-inner">
      <div class="brand-logo">
        <img src="assets/icons/logo.png" alt="FurniMind AI" style="height: 36px; width: auto;" />
      </div>

      <div class="form-header">
        <h1>{{ t().pageTitle }}</h1>
        <p>{{ t().pageSubtitle }}</p>
      </div>

      <div class="inline-error" *ngIf="errorMessage" role="alert">
        {{ errorMessage }}
      </div>

      <form [formGroup]="otpForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="email">{{ t().emailLabel }}</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
            </span>
            <input
              type="email"
              id="email"
              formControlName="email"
              [placeholder]="t().emailPlaceholder"
              [class.is-invalid]="otpForm.get('email')?.touched && otpForm.get('email')?.invalid"
              appAutoDir
            />
          </div>
          <div class="error-msg" *ngIf="otpForm.get('email')?.touched && otpForm.get('email')?.hasError('required')">{{ t().emailRequired }}</div>
          <div class="error-msg" *ngIf="otpForm.get('email')?.touched && otpForm.get('email')?.hasError('email')">{{ t().emailInvalid }}</div>
        </div>

        <div class="form-group">
          <label for="otpCode">{{ t().otpLabel }}</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h16M4 12h16M4 17h16" />
              </svg>
            </span>
            <input
              type="text"
              id="otpCode"
              formControlName="otpCode"
              [placeholder]="t().otpPlaceholder"
              [class.is-invalid]="otpForm.get('otpCode')?.touched && otpForm.get('otpCode')?.invalid"
              appAutoDir
            />
          </div>
          <div class="error-msg" *ngIf="otpForm.get('otpCode')?.touched && otpForm.get('otpCode')?.hasError('required')">{{ t().otpRequired }}</div>
        </div>

        <button type="submit" class="btn-submit" [disabled]="otpForm.invalid || isLoading">
          <span *ngIf="!isLoading">{{ t().submitButton }}</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>
      </form>

      <p class="auth-footer">
        <a [routerLink]="navRoutes.LOGIN">{{ t().loginLink }}</a>
      </p>
    </div>
  </div>

  <div class="auth-visual-side">
    <div class="visual-content">
      <div class="visual-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <h2>{{ t().visualHeading }}</h2>
      <p class="visual-subtitle">{{ t().visualSubtitle }}</p>
    </div>
  </div>
</div>
