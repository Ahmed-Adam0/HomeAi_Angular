@if (cartSuccessService.isOpen(); as data) {
  @let item = cartSuccessService.item();
  @if (item) {
    <div class="csm-overlay" (click)="onBackdropClick($event)">
      <div class="csm-modal">
        <button type="button" class="csm-close" (click)="close()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <div class="csm-icon-wrapper">
          <svg class="csm-check-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>

        <h3 class="csm-title">{{ 'SUCCESSFULLY_ADDED' | translate }}</h3>

        <div class="csm-product">
          <div class="csm-product-image-wrapper">
            <img [src]="item.productImage" [alt]="item.productName" class="csm-product-image" />
          </div>
          <div class="csm-product-info">
            <p class="csm-product-name">{{ item.productName }}</p>
            <span class="csm-product-price">{{ item.price | currencyFormat }}</span>
          </div>
        </div>

        <div class="csm-actions">
          <a [routerLink]="'/checkout'" class="csm-btn csm-btn-primary" (click)="close()">
            {{ 'CHECKOUT' | translate }}
          </a>
          <a [routerLink]="'/cart'" class="csm-btn csm-btn-secondary" (click)="close()">
            {{ 'VIEW_CART' | translate }}
          </a>
        </div>
      </div>
    </div>
  }
}
