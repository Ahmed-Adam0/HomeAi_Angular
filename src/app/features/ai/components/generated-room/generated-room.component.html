<div class="room-wrapper d-flex flex-column align-items-center justify-content-center h-100 p-4">
  <!-- Room Image Container -->
  <div class="room-container position-relative shadow-lg rounded-4 overflow-hidden">
    <!-- Using local asset image or fallback -->
    <img [src]="aiService.currentRoom().imageUrl" alt="AI Generated Room" class="room-image w-100 h-100 object-fit-cover" />

    <!-- Hotspots -->
    @for (hs of aiService.currentRoom().hotspots; track hs.id) {
      <div class="hotspot-wrapper position-absolute"
           [style.left.%]="hs.x"
           [style.top.%]="hs.y"
           [class.active]="aiService.selectedHotspotId() === hs.id">
        
        <!-- Hover label/tag -->
        <span class="hotspot-label font-sans fs-8 fw-semibold px-2.5 py-1 rounded shadow-md">
          {{ hs.label }}
        </span>

        <!-- Hotspot button -->
        <button class="hotspot-btn d-flex align-items-center justify-content-center fw-bold fs-7.5"
                (click)="selectHotspot(hs.id, $event)">
          {{ hs.id }}
        </button>
      </div>
    }
  </div>

  <!-- Proceed button -->
  <div class="mt-4">
    <button class="btn btn-proceed font-sans fw-bold px-4 py-2.5 shadow-sm d-flex align-items-center gap-2"
            (click)="openSummary()">
      <span>Proceed to Order</span>
    </button>
  </div>
</div>
