<div class="room-wrapper d-flex flex-column align-items-center justify-content-center h-100 p-4">

  <!-- Main Room Workspace Container -->
  <div class="room-container position-relative shadow-lg rounded-4 overflow-hidden">

    <!-- ── Workspace Image ───────────────────────────────────────────────────
         Priority:  generatedImageUrl  →  previewUrl (uploaded)  →  demo room
         The single [src] binding handles all three cases automatically.
         TODO: generatedImageUrl will be populated by the backend generation
               endpoint — no template changes will be needed at that point.
    ──────────────────────────────────────────────────────────────────────── -->
    @if (isGenerated()) {
      <app-before-after-slider
        [beforeImageUrl]="sessionService.session().roomPreviewUrl ?? ''"
        [afterImageUrl]="sessionService.session().generatedImageUrl ?? ''"
        [beforeLabel]="'AI.ROOM_PREVIEW.UPLOADED_LABEL' | translate"
        [afterLabel]="'AI.ROOM_PREVIEW.GENERATED_LABEL' | translate"
        class="w-100 h-100 d-block"
      ></app-before-after-slider>

      <button 
        class="btn btn-download position-absolute d-flex align-items-center gap-2"
        [disabled]="isDownloading()"
        (click)="downloadImage()"
        [attr.aria-label]="'AI.WORKSPACE.DOWNLOAD_IMAGE' | translate"
      >
        @if (isDownloading()) {
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span>{{ 'AI.WORKSPACE.DOWNLOADING' | translate }}</span>
        } @else {
          <i class="bi bi-download"></i>
          <span>{{ 'AI.WORKSPACE.DOWNLOAD_IMAGE' | translate }}</span>
        }
      </button>
    } @else {
      <img
        [src]="workspaceImageUrl()"
        alt="Room workspace"
        class="room-image w-100 h-100 object-fit-contain"
      />
    }

    <!-- ── "Awaiting Generation" Overlay ────────────────────────────────────
         Shown after the user has uploaded a room but before the AI runs.
         Disappears automatically once generatedImageUrl is populated.
    ──────────────────────────────────────────────────────────────────────── -->
    @if (isAwaitingGeneration()) {
      <div class="awaiting-overlay position-absolute inset-0 d-flex flex-column align-items-center justify-content-center gap-3 p-4">
        <div class="awaiting-icon d-flex align-items-center justify-content-center rounded-circle">
          <i class="bi bi-magic"></i>
        </div>
        <div class="text-center">
          <p class="awaiting-title fw-bold mb-1 font-display">
            {{ 'AI.WORKSPACE.READY_TITLE' | translate }}
          </p>
          <p class="awaiting-desc mb-0 font-sans">
            {{ 'AI.WORKSPACE.READY_DESC' | translate }}
          </p>
        </div>
      </div>
    }

  </div>

  <!-- Proceed to Order — only visible when AI has generated a result -->
  @if (isGenerated()) {
    <div class="mt-4">
      <button class="btn btn-proceed font-sans fw-bold px-4 py-2.5 shadow-sm d-flex align-items-center gap-2"
              (click)="openSummary()">
        <span>{{ 'AI.WORKSPACE.PROCEED_ORDER' | translate }}</span>
      </button>
    </div>
  }

  <!-- Demo Proceed button — visible in demo mode (no session active) -->
  @if (!sessionService.hasRoom()) {
    <div class="mt-4">
      <button class="btn btn-proceed font-sans fw-bold px-4 py-2.5 shadow-sm d-flex align-items-center gap-2"
              (click)="openSummary()">
        <span>{{ 'AI.WORKSPACE.PROCEED_ORDER' | translate }}</span>
      </button>
    </div>
  }

</div>
