<div [class.loading-overlay]="overlay" [class.d-flex]="true" class="flex-column align-items-center justify-content-center">
  <div class="spinner-container position-relative">
    <div class="spinner-ring" [class.spinner-sm]="size === 'sm'" [class.spinner-md]="size === 'md'" [class.spinner-lg]="size === 'lg'"></div>
    <div class="spinner-core"></div>
  </div>
  @if (message) {
    <p class="mt-3 text-secondary fw-semibold spinner-msg">{{ message }}</p>
  }
</div>
