  <g transform="translate(165, 80)" stroke="#c4b5a0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Backrest -->
    <path d="M15 45 C15 25, 25 15, 35 15 L35 15 C45 15, 55 25, 55 45" />
    <!-- Seat Cushion -->
