<section class="notification-empty-state" role="status">
  <div class="notification-empty-state__inner">
    <div class="notification-empty-state__icon-wrap" aria-hidden="true">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </div>

    <ng-content />

    <app-button
      [label]="'Refresh'"
      variant="outline"
      size="md"
      (clicked)="refresh.emit()"
    />
  </div>
</section>
