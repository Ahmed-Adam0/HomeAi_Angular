<div class="auth-wrapper login-mirror" [attr.dir]="direction()" [attr.lang]="currentLang()">
     <div class="auth-visual-side">
    <div class="visual-content">
      <div class="visual-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <h2>{{ t().visualHeading }}</h2>
      <p class="visual-subtitle">{{ t().visualSubtitle }}</p>
    </div>
  </div>
    
  <div class="auth-form-side">
    <div class="auth-form-inner">
      <div class="brand-logo">
        <div class="logo-icon-small">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
        </div>
        <span class="logo-text">FurniMind AI</span>
      </div>

      <div class="form-header">
        <h1>{{ t().pageTitle }}</h1>
        <p>{{ t().pageSubtitle }}</p>
      </div>

      <div class="alert-danger" *ngIf="errorMessage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ errorMessage }}
      </div>

      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="email">{{ t().emailLabel }}</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
            </span>
            <input
              type="email"
              id="email"
              formControlName="email"
              [placeholder]="t().emailPlaceholder"
              [class.is-invalid]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid"
            />
          </div>
          <div class="error-msg" *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('required')">{{ t().emailRequired }}</div>
          <div class="error-msg" *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('email')">{{ t().emailInvalid }}</div>
        </div>

        <button type="submit" class="btn-submit" [disabled]="forgotForm.invalid || isLoading">
          <span *ngIf="!isLoading">{{ t().submitButton }}</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>
      </form>

      <p class="auth-footer">
        <a [routerLink]="navRoutes.LOGIN">{{ t().loginLink }}</a>
      </p>
    </div>
  </div>

 
</div>
