@if (visible()) {
  <button
    type="button"
    class="scroll-top-btn"
    (click)="scrollToTop()"
    aria-label="Scroll to top"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="scroll-top-icon">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
}
