<button
  [type]="type()"
  [class]="buttonClass()"
  [disabled]="isButtonDisabled()"
  (click)="onClick($event)"
>
  @if (isLoading()) {
    <span class="fm-btn-spinner"></span>
  }

  <span class="btn-content fm-btn-text" [class.btn-content-hidden]="isLoading()">
    @if (label()) {
      {{ label() }}
    } @else {
      <ng-content></ng-content>
    }
  </span>
</button>
