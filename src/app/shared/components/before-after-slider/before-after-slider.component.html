<div class="comparison-container" #container [class.dragging]="isDragging">
  <!-- AFTER Image (Base Layer) -->
  <img [src]="afterImageUrl" class="image-after" alt="After Transformation" loading="lazy" />
  @if (afterLabel) {
    <span class="badge-tag badge-after">
      {{ afterLabel }}
    </span>
  }

  <!-- BEFORE Image (Clipped Overlay Layer) -->
  <img #imageBefore [src]="beforeImageUrl" 
       class="image-before" 
       [style.clip-path]="'inset(0 50% 0 0)'" 
       alt="Before Transformation" 
       loading="lazy" />
  @if (beforeLabel) {
    <span #badgeBefore class="badge-tag badge-before" [style.opacity]="1">
      {{ beforeLabel }}
    </span>
  }

  <!-- Interactive Drag Handle -->
  <div #sliderHandle class="slider-handle" 
       [style.left.%]="50" 
       (pointerdown)="startDrag($event)"
       (touchstart)="startDrag($event)"
       (mousedown)="startDrag($event)">
    <div class="handle-line"></div>
    <div class="handle-button">
      <i class="bi bi-chevron-left"></i>
      <i class="bi bi-chevron-right"></i>
    </div>
    <div class="handle-line"></div>
  </div>
</div>
