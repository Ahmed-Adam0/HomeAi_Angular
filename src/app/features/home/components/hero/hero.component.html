<section class="hero-cinematic">
  <!-- Scroll track: provides 300vh of scroll space -->
  <div class="hero-cinematic__track">
    <!-- Pinned container: stays fixed during scroll -->
    <div class="hero-cinematic__pinned">

      <!-- ROOM IMAGE LAYER -->
      <div class="hero-cinematic__room">
        <!-- Before state -->
        <img
          class="room-before"
          src="/assets/images/hero_interior.png"
          alt="Interior room"
        />
        <!-- After state: same image with enhancements overlay -->
        <div class="room-after">
          <img
            class="room-after__img"
            src="/assets/images/hero_interior.png"
            alt="AI-enhanced interior"
          />
          <div class="room-after__enhance" aria-hidden="true">
            <!-- Furniture silhouette overlays for after state -->
            <svg class="room-after__furniture" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
              <!-- Sofa silhouette -->
              <path class="furniture-item" d="M280 640 L280 720 L520 720 L520 640 C520 600, 480 580, 400 580 C320 580, 280 600, 280 640Z" fill="rgba(184,142,90,0.12)" stroke="rgba(184,142,90,0.2)" stroke-width="1"/>
              <!-- Coffee table -->
              <ellipse class="furniture-item" cx="650" cy="740" rx="100" ry="30" fill="rgba(184,142,90,0.1)" stroke="rgba(184,142,90,0.18)" stroke-width="1"/>
              <!-- Floor lamp -->
              <path class="furniture-item" d="M1400 580 L1400 780 M1380 580 L1420 580 M1360 540 C1360 510, 1440 510, 1440 540 L1360 540Z" fill="none" stroke="rgba(184,142,90,0.15)" stroke-width="2"/>
              <!-- Artwork frame -->
              <rect class="furniture-item" x="1550" y="300" width="140" height="180" rx="4" fill="rgba(184,142,90,0.08)" stroke="rgba(184,142,90,0.15)" stroke-width="1.5"/>
              <!-- Plant -->
              <path class="furniture-item" d="M1100 700 C1100 640, 1060 600, 1100 560 C1140 600, 1100 640, 1100 700Z" fill="rgba(120,150,100,0.12)" stroke="rgba(120,150,100,0.18)" stroke-width="1"/>
              <!-- Rug -->
              <ellipse class="furniture-item" cx="550" cy="790" rx="200" ry="40" fill="rgba(200,180,160,0.08)" stroke="rgba(200,180,160,0.12)" stroke-width="1"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- OVERLAY GRADIENT for depth -->
      <div class="hero-cinematic__overlay"></div>

      <!-- ===== SCENE 1: HEADLINE ===== -->
      <div class="hero-cinematic__headline">
        <span class="hl-line hl-line--1">Furniture</span>
        <span class="hl-line hl-line--2">Chosen</span>
        <span class="hl-line hl-line--3">For You</span>
      </div>

      <!-- ===== SCENE 2: AI DETECTION ===== -->
      <div class="hero-cinematic__scanline"></div>

      <div class="hero-cinematic__dots">
        <div class="detect-dot" style="top:32%;left:22%">
          <span class="detect-dot__ring"></span>
          <span class="detect-dot__label">Sofa Area</span>
        </div>
        <div class="detect-dot" style="top:48%;left:52%">
          <span class="detect-dot__ring"></span>
          <span class="detect-dot__label">Coffee Table</span>
        </div>
        <div class="detect-dot" style="top:58%;left:76%">
          <span class="detect-dot__ring"></span>
          <span class="detect-dot__label">Floor Lamp</span>
        </div>
        <div class="detect-dot" style="top:28%;left:62%">
          <span class="detect-dot__ring"></span>
          <span class="detect-dot__label">Wall Art</span>
        </div>
        <div class="detect-dot" style="top:72%;left:38%">
          <span class="detect-dot__ring"></span>
          <span class="detect-dot__label">Rug</span>
        </div>
      </div>

      <div class="hero-cinematic__scan-status">AI Room Analysis</div>

      <!-- ===== SCENE 3: PRODUCT RECOMMENDATIONS ===== -->
      <div class="hero-cinematic__products">
        <div class="product-card">
          <div class="product-card__thumb" style="background:#b8a89a"></div>
          <div class="product-card__body">
            <span class="product-card__name">Nordic Lounge Chair</span>
            <span class="product-card__match">
              <span class="product-card__pct">92</span>% Match
            </span>
          </div>
        </div>
        <div class="product-card">
          <div class="product-card__thumb" style="background:#c9b9a5"></div>
          <div class="product-card__body">
            <span class="product-card__name">Marble Coffee Table</span>
            <span class="product-card__match">
              <span class="product-card__pct">87</span>% Match
            </span>
          </div>
        </div>
        <div class="product-card">
          <div class="product-card__thumb" style="background:#d4c8b4"></div>
          <div class="product-card__body">
            <span class="product-card__name">Linen Floor Lamp</span>
            <span class="product-card__match">
              <span class="product-card__pct">95</span>% Match
            </span>
          </div>
        </div>
      </div>

      <!-- ===== SCENE 4: BEFORE / AFTER LABELS ===== -->
      <div class="hero-cinematic__ba">
        <span class="ba-label ba-label--before">Original Room</span>
        <span class="ba-label ba-label--after">AI Enhanced</span>
      </div>

      <!-- ===== SCENE 5: FINAL STATEMENT ===== -->
      <div class="hero-cinematic__final">
        <p class="final-text">&ldquo;Your Room Already<br />Knows What It Needs.&rdquo;</p>
      </div>

    </div>
  </div>
</section>
