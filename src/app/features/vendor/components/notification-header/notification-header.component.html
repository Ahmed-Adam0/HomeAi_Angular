<header class="notification-header">
  <div class="notification-header__content">
    <p class="notification-header__eyebrow">{{ 'VENDOR.COMMON.PORTAL' | translate }}</p>

    <div class="notification-header__title-row">
      <span class="notification-header__title-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </span>
      <h1 class="notification-header__title">{{ 'VENDOR.NOTIFICATIONS.TITLE' | translate }}</h1>
      <app-unread-badge [count]="unreadCount()" />
    </div>

    <p class="notification-header__description">
      {{ 'VENDOR.NOTIFICATIONS.SUBTITLE' | translate }}
    </p>
  </div>

  <div class="notification-header__actions">
    @if (showMarkAll()) {
      <app-button
        [label]="'VENDOR.NOTIFICATIONS.MARK_ALL_READ' | translate"
        variant="outline"
        size="sm"
        [disabled]="!hasUnread()"
        [isLoading]="markAllLoading()"
        (clicked)="markAllRead.emit()"
      />
    }
  </div>
</header>
