<div class="empty-state-container">
  <div class="empty-state-icon">{{ icon }}</div>
  <h3 class="empty-state-title">{{ title }}</h3>
  <p class="empty-state-copy">{{ description }}</p>
  @if (actionText) {
    <app-button
      [label]="actionText"
      variant="premium"
      size="lg"
      (clicked)="onAction()"
      class="empty-state-action"
    ></app-button>
  }
</div>
