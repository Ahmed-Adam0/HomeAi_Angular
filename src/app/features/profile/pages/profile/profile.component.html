<main class="profile-page container py-4 py-md-5" appRtl>
  <div class="row gy-4">
    <!-- Sidebar Left Column -->
    <section class="col-12 col-xl-4">
      <app-profile-sidebar-card
        [profile]="profile()"
        [avatarPreview]="profilePreview()"
        [stats]="sidebarStats()"
        [uploading]="imageUploading()"
        (logout)="onLogout()"
        (createAiDesign)="onCreateAiDesign()"
        (fileSelected)="handleImageSelected($event)">
      </app-profile-sidebar-card>
    </section>

    <!-- Content Right Column -->
    <section class="col-12 col-xl-8">
      <div class="row g-4">
        <!-- Unified Personal Information Card -->
        <div class="col-12">
          <app-editable-profile-form
            [profile]="profile()"
            [submitting]="formSubmitting()"
            (saveProfile)="handleSaveProfile($event)">
          </app-editable-profile-form>
        </div>

        <!-- Change Password Card -->
        <div class="col-12">
          <app-change-password-form></app-change-password-form>
        </div>

        <!-- Account Settings Card -->
        <div class="col-12">
          <app-profile-settings-card
            [actions]="actionItems()"
            (selectAction)="handleAction($event)">
          </app-profile-settings-card>
        </div>

        <!-- Address List Card -->
        <div class="col-12" #profileAddresses>
          <app-profile-address-list
            [addresses]="profile()?.addresses ?? []"
            [submitting]="formSubmitting()"
            (updateAddresses)="handleUpdateAddresses($event)">
          </app-profile-address-list>
        </div>

        <!-- AI Design Activity Card (Focal Point) -->
        <div class="col-12">
          <div class="ai-activity-card card border-0 rounded-4 overflow-hidden shadow-sm">
            <div class="card-body p-4 p-md-5">
              <div class="d-flex align-items-center gap-3 mb-4">
                <div class="activity-icon-container d-flex align-items-center justify-content-center rounded-3 bg-white shadow-sm">
                  <i class="bi bi-sparkles text-brand fs-4"></i>
                </div>
                <div>
                  <h3 class="h5 mb-1 font-semibold text-dark">{{ 'PROFILE.AI_DESIGN_ACTIVITY' | translate }}</h3>
                  <p class="text-muted small mb-0">{{ 'PROFILE.AI_DESIGN_JOURNEY' | translate }}</p>
                </div>
              </div>

              <!-- Stat Boxes Grid -->
              <div class="row row-cols-2 row-cols-md-4 g-3 mb-4">
                <div class="col" *ngFor="let stat of profileStats(); trackBy: trackByStat">
                  <div class="activity-stat-box p-3 rounded-4 bg-white shadow-xs text-center d-flex flex-column justify-content-center h-100 transition-all">
                    <span class="activity-stat-value display-6 font-bold text-dark mb-1">{{ stat.value }}</span>
                    <span class="activity-stat-label text-muted text-uppercase" style="font-size: 0.6875rem; letter-spacing: 0.04em;">{{ stat.labelKey | translate }}</span>
                  </div>
                </div>
              </div>

              <!-- CTA Button -->
              <div class="text-center mt-4 pt-2">
                <button type="button" class="btn btn-dark btn-md btn-rounded btn-ripple-effect px-4" (click)="onCreateAiDesign()">
                  <i class="bi bi-sparkles me-2"></i>
                  {{ 'PROFILE.CREATE_AI_DESIGN' | translate }}
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
