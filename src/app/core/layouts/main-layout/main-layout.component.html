<div appRtl>
  <app-navbar></app-navbar>

  <main class="w-100 mx-auto">
    <router-outlet></router-outlet>
  </main>

  <footer>
    <app-footer></app-footer>
  </footer>

  <app-auth-required-dialog></app-auth-required-dialog>
  <app-confirm-dialog-container></app-confirm-dialog-container>
  <app-toast></app-toast>

  @if (uiState.activeAlert(); as alert) {
    @if (alert.type === 'success' && alert.action?.routerLink === '/cart') {
    } @else {
      <div class="position-fixed top-0 end-0 p-3" style="z-index: 1100; max-width: 400px; width: 100%;">
        <app-alert
          [type]="alert.type"
          [message]="alert.message"
          [action]="alert.action ?? null"
          (close)="uiState.dismissAlert()">
        </app-alert>
      </div>
    }
  }

  <app-cart-success-modal />

  <app-scroll-to-top />
  <app-chatbot-widget />
</div>
