<div class="container py-5">
  <div class="text-center mb-5">
    <h1 class="fw-bold text-dark">Furniture Categories</h1>
    <p class="text-secondary lead">Explore our curated collections designed for modern homes</p>
  </div>
  
  <div class="row g-4">
    @for (cat of categories(); track cat.id) {
      <div class="col-md-6 col-lg-3">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100 category-card" [routerLink]="['/products']" [queryParams]="{ category: cat.id }">
          <div class="category-img-wrapper bg-light position-relative">
            <span class="category-badge position-absolute top-3 end-3 badge bg-dark text-white fw-bold">
              {{ cat.itemCount }} Items
            </span>
            <div class="category-placeholder-icon text-center py-5 fs-1">🛋️</div>
          </div>
          <div class="card-body p-4 text-center">
            <h4 class="fw-bold text-dark mb-2">{{ cat.name }}</h4>
            <p class="text-secondary small m-0">{{ cat.description }}</p>
          </div>
        </div>
      </div>
    }
  </div>
</div>
