<div class="auth-wrapper login-mirror" [attr.dir]="direction()" [attr.lang]="currentLang()">
  <div class="auth-visual-side">
    <div class="visual-content">
      <div class="visual-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <h2>{{ t().visualHeading }}</h2>
      <p class="visual-subtitle">{{ t().visualSubtitle }}</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-form-inner">
      <div class="brand-logo">
        <img src="assets/icons/logo.png" alt="FurniMind AI" style="height: 36px; width: auto;" />
      </div>

      <div class="form-header">
        <h1>{{ t().pageTitle }}</h1>
        <p>{{ t().pageSubtitle }}</p>
      </div>

      <div class="inline-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">

        <div class="form-group">
          <label for="newPassword">{{ t().newPasswordLabel }}</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input type="password" id="newPassword" formControlName="newPassword"
              [placeholder]="t().newPasswordPlaceholder"
              [class.is-invalid]="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.invalid"
              appAutoDir />
          </div>
          <div class="error-msg"
            *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.hasError('required')">{{
            t().newPasswordRequired }}</div>
        </div>

        <div class="form-group">
          <label for="confirmNewPassword">{{ t().confirmPasswordLabel }}</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input type="password" id="confirmNewPassword" formControlName="confirmNewPassword"
              [placeholder]="t().confirmPasswordLabel"
              [class.is-invalid]="resetForm.get('confirmNewPassword')?.touched && resetForm.get('confirmNewPassword')?.invalid || resetForm.hasError('mismatch')"
              appAutoDir />
          </div>
          <div class="error-msg"
            *ngIf="resetForm.get('confirmNewPassword')?.touched && resetForm.get('confirmNewPassword')?.hasError('required')">
            {{ t().newPasswordRequired }}</div>
          <div class="error-msg" *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmNewPassword')?.touched">
            {{ t().passwordsMismatch }}</div>
        </div>

        <button type="submit" class="btn-submit" [disabled]="resetForm.invalid || isLoading">
          <span *ngIf="!isLoading">{{ t().submitButton }}</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>
      </form>

      <p class="auth-footer">
        <a [routerLink]="navRoutes.LOGIN">{{ t().loginLink }}</a>
      </p>
    </div>
  </div>


</div>
