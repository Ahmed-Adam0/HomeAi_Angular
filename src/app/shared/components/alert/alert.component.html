@if (visible && message) {
  <div class="alert-premium shadow-sm border-0 d-flex align-items-center p-3 mb-2.5 rounded-3" [class]="'alert-' + type">
    <!-- Left Icon Wrapper -->
    <div class="alert-icon-wrapper rounded-circle d-flex align-items-center justify-content-center flex-shrink-0 position-relative me-3">
      @switch (type) {
        @case ('success') {
          <i class="bi bi-check-lg fs-6"></i>
          @if (message.toLowerCase().includes('favorite') || message.includes('مفضل')) {
            <i class="bi bi-heart-fill mini-heart-badge"></i>
          }
        }
        @case ('danger') { <i class="bi bi-x-circle fs-6"></i> }
        @case ('warning') { <i class="bi bi-exclamation-triangle fs-6"></i> }
        @case ('info') { <i class="bi bi-info-circle fs-6"></i> }
      }
    </div>

    <!-- Middle Content Wrapper -->
    <div class="alert-content-wrapper d-flex align-items-center flex-wrap gap-2.5 flex-grow-1 overflow-hidden">
      <span class="alert-text fw-medium" [title]="message">{{ message }}</span>
      
      <!-- Subtle, lightweight inline CTA for Favorites -->
      <a
        *ngIf="type === 'success' && (message.toLowerCase().includes('favorite') || message.includes('مفضل'))"
        routerLink="/favorites"
        class="alert-cta-btn font-xxxxs fw-semibold text-decoration-none text-uppercase py-1 px-2.5 rounded-pill transition-all"
      >
        {{ message.includes('مفضل') ? 'عرض' : 'View' }}
      </a>
    </div>

    <!-- Right Close Button -->
    @if (dismissible) {
      <button type="button" (click)="onClose()" class="btn-close-premium border-0 bg-transparent rounded-circle d-flex align-items-center justify-content-center ms-3 flex-shrink-0" aria-label="Close">
        <i class="bi bi-x fs-5"></i>
      </button>
    }
  </div>
}
