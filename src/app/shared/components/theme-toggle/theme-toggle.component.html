<!-- ═══════════════════════════════════════════════════════
     Minimal Luxury Theme Toggle — Sun ↔ Moon
     68 × 34 px  ·  High-end Glassmorphic  ·  Apple / Vercel style
     ═══════════════════════════════════════════════════════ -->

<button
  class="luxury-toggle"
  [class.luxury-toggle--dark]="themeService.isDarkSignal()"
  [class.luxury-toggle--hovered]="isHovered()"
  [class.luxury-toggle--pressed]="isPressed()"
  [class.luxury-toggle--sliding]="isSliding()"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (mousemove)="onMouseMove($event)"
  (mousedown)="onMouseDown($event)"
  (mouseup)="onMouseUp()"
  (click)="onToggleTheme($event)"
  (keydown)="onKeyDown($event)"
  role="switch"
  [attr.aria-checked]="themeService.isDarkSignal()"
  aria-label="Toggle theme mode"
  [title]="themeService.isDarkSignal() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
  [style.transform]="parallaxTransform()"
>
  <div class="toggle-container">
    <!-- Floating Circular Glass Thumb -->
    <div class="floating-thumb" [style.transform]="thumbTransform()">
      <div class="thumb-glow"></div>
      <div class="thumb-lens"></div>
    </div>

    <!-- Moon Icon (Left) representing Dark Mode -->
    <div class="icon-wrapper icon-wrapper--moon" [class.icon-wrapper--active]="themeService.isDarkSignal()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    </div>

    <!-- Sun Icon (Right) representing Light Mode -->
    <div class="icon-wrapper icon-wrapper--sun" [class.icon-wrapper--active]="!themeService.isDarkSignal()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2"/>
        <path d="M12 20v2"/>
        <path d="M4.93 4.93l1.41 1.41"/>
        <path d="M17.66 17.66l1.41 1.41"/>
        <path d="M2 12h2"/>
        <path d="M20 12h2"/>
        <path d="M6.34 17.66l-1.41 1.41"/>
        <path d="M19.07 4.93l-1.41 1.41"/>
      </svg>
    </div>
  </div>
</button>
