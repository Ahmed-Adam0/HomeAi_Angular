    <line x1="15" y1="55" x2="10" y2="68" />
    <line x1="55" y1="55" x2="60" y2="68" />
  </g>
  
  <!-- Premium Typographic Labels -->
  <text x="200" y="195" text-anchor="middle" fill="#8c7e6b" font-size="12" font-weight="700" letter-spacing="0.1em">FURNIMIND</text>
