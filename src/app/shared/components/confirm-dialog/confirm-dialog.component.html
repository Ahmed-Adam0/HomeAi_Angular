@if (showOverlay()) {
  <div
    class="confirm-overlay"
    [class.confirm-overlay-closing]="closing()"
    (click)="onBackdropClick()"
  >
    <div
      class="confirm-card"
      [class.confirm-danger]="variant() === 'danger'"
      [class.confirm-warning]="variant() === 'warning'"
      [class.confirm-info]="variant() === 'info'"
      [class.confirm-card-closing]="closing()"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
    >
      <div class="confirm-icon-wrapper">
        @switch (variant()) {
          @case ('danger') {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          }
          @case ('warning') {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          }
          @case ('info') {
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          }
        }
      </div>
      <h4 class="confirm-title">{{ title() }}</h4>
      <p class="confirm-message">{{ message() }}</p>
      <div class="confirm-actions">
        <button (click)="onCancel()" class="confirm-btn confirm-btn-cancel">{{ cancelText() }}</button>
        <button (click)="onConfirm()" class="confirm-btn confirm-btn-primary" [class.confirm-btn-danger]="variant() === 'danger'" [class.confirm-btn-warning]="variant() === 'warning'" [class.confirm-btn-info]="variant() === 'info'">{{ confirmText() }}</button>
      </div>
    </div>
  </div>
}
