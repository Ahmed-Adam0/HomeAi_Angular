<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FurniMind AI - Premium Furniture Marketplace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F8F6F2" id="meta-theme-color">
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.png">
  <link rel="alternate icon" type="image/x-icon" href="logo.png">
  
  <!-- Inline blocker script to resolve active theme and set data-theme synchronously -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('fm_theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <app-root>
    <div class="pre-bootstrap-loader">
      <div class="loader-content">
        <img src="assets/icons/logo.png" alt="FurniMind AI" class="loader-logo" />
        <div class="loader-brand">FurniMind AI</div>
      </div>
    </div>
    <style>
      body {
        margin: 0;
        background-color: #faf9f6;
      }
      html[data-theme="dark"] body {
        background-color: #12100e;
      }
      .pre-bootstrap-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #faf9f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      html[data-theme="dark"] .pre-bootstrap-loader {
        background-color: #12100e;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .loader-logo {
        width: 96px;
        height: 96px;
        animation: pulse-scale 2s infinite ease-in-out;
      }
      .loader-brand {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #b8935c;
        opacity: 0.8;
      }
      html[data-theme="dark"] .loader-brand {
        color: #c8a87b;
      }
      @keyframes pulse-scale {
        0%, 100% {
          transform: scale(0.95);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }
    </style>
  </app-root>
</body>
</html>
