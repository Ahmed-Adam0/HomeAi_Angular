<button (click)="toggleLanguage()" class="lang-text-switch" aria-label="Toggle language">
  <span class="lang-option" [class.lang-active]="translationService.currentLang() === 'en'">EN</span>
  <span class="lang-divider">|</span>
  <span class="lang-option" [class.lang-active]="translationService.currentLang() === 'ar'">AR</span>
</button>
