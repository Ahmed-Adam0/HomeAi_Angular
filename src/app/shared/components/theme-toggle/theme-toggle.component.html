<button 
  class="theme-toggle-btn" 
  (click)="toggleTheme()" 
  aria-label="Toggle active theme mode"
  [title]="themeService.isDarkSignal() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
>
  <div class="icon-wrapper">
    <i class="bi bi-sun icon-sun"></i>
    <i class="bi bi-moon-stars icon-moon"></i>
  </div>
</button>
