<main class="vendor-profile-page container py-4 py-md-5" appRtl>
  <div class="row gy-4">
    <div class="col-12">
      <app-workshop-profile-form
        [profile]="profile()"
        [loading]="loading()"
        [saving]="saving()"
        [uploadingLogo]="uploadingLogo()"
        [uploadingAvatar]="uploadingAvatar()"
        [editing]="isEditing()"
        (saveProfile)="onSaveProfile($event)"
        (uploadLogo)="onUploadLogo($event)"
        (uploadAvatar)="onUploadAvatar($event)"
        (editProfile)="editProfile()"
        (cancelEdit)="cancelEdit()"
      />
    </div>
  </div>
</main>
