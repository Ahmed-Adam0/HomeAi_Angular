<div class="custom-dropdown-container" [class.disabled]="disabled" [class.open]="isOpen()">
  <button type="button" class="dropdown-trigger" (click)="toggleDropdown()" [disabled]="disabled">
    <span class="trigger-text">{{ selectedLabel }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" class="arrow-icon">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>
</div>
