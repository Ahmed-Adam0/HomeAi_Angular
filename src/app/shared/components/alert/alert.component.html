@if (visible && message) {
  <div
    class="alert-root"
    [class.alert-inline]="inline"
    [class.alert-overlay]="!inline"
    [class.alert-success]="type === 'success'"
    [class.alert-danger]="type === 'danger'"
    [class.alert-warning]="type === 'warning'"
    [class.alert-info]="type === 'info'"
    role="alert"
    aria-live="polite"
  >
    <div class="alert-icon-wrapper">
      @switch (type) {
        @case ('success') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="alert-svg">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="16 8 10 16 7 13"/>
          </svg>
        }
        @case ('danger') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="alert-svg">
            <circle cx="12" cy="12" r="10"/>
            <path d="M15 9l-6 6M9 9l6 6"/>
          </svg>
        }
        @case ('warning') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="alert-svg">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        }
        @case ('info') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="alert-svg">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        }
      }
    </div>

    <span class="alert-text">{{ message }}</span>

    @if (action) {
      <a [routerLink]="action.routerLink" (click)="onClose()" class="alert-action">
        <span class="alert-action-label">{{ action.label }}</span>
        <svg class="alert-action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </a>
    }

    @if (dismissible) {
      <button type="button" (click)="onClose()" class="alert-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="close-svg">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    }
  </div>
}
