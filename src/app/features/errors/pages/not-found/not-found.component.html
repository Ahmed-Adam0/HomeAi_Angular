<div class="not-found-wrapper" 
     [style.--mouse-x]="mouseX()" 
     [style.--mouse-y]="mouseY()"
     [class.lamp-active]="lampOn()">
  
  <!-- Interactive Ambient Background Layer -->
  <div class="background-ambient">
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>
    <div class="glow-radial-base"></div>
    <div class="noise-overlay"></div>
  </div>

  <!-- Holographic AI Layer -->
  <div class="ai-hologram-container">
    <div class="hologram-grid"></div>
    <div class="scanlines"></div>
    <div class="pulse-wave wave-1"></div>
    <div class="pulse-wave wave-2"></div>
  </div>

  <!-- Floating Particles Layer -->
  <div class="particles-container">
    <div class="particle p-1"></div>
    <div class="particle p-2"></div>
    <div class="particle p-3"></div>
    <div class="particle p-4"></div>
    <div class="particle p-5"></div>
    <div class="particle p-6"></div>
    <div class="particle p-7"></div>
    <div class="particle p-8"></div>
  </div>

  <!-- Main Container -->
  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center px-4 py-5 position-relative z-3">
    <div class="row w-100 max-container-width align-items-center justify-content-between g-5">
      
      <!-- Left Column: Branding, Elegant Text, and CTA Buttons -->
      <div class="col-lg-5 col-md-12 text-section d-flex flex-column align-items-start text-start">
        <div class="brand-tag mb-4">
          <span class="pulse-dot"></span>
          <span class="tag-text">FURNIMIND AI // SYSTEM ERROR 404</span>
        </div>

        <h1 class="headline mb-4">
          Oops... <br>
          <span class="text-gradient">This room doesn't exist.</span>
        </h1>

        <p class="description mb-5">
          Looks like the page you're searching for has been moved, redesigned, or never existed in our catalog. Let's guide you back to the showroom.
        </p>

        <div class="button-group d-flex flex-sm-row flex-column gap-3 w-100">
          <a routerLink="/" 
             class="btn-premium btn-primary-glass d-inline-flex align-items-center justify-content-center"
             aria-label="Return to the showroom homepage">
            <span class="btn-inner">
              <span class="btn-text">Return Home</span>
              <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m15 18-6-6 6-6"/>
              </svg>
            </span>
            <div class="btn-glow"></div>
            <div class="btn-border-glow"></div>
          </a>

          <a routerLink="/products" 
             class="btn-premium btn-secondary-glass d-inline-flex align-items-center justify-content-center"
             aria-label="Continue browsing our catalog of furniture">
            <span class="btn-inner">
              <span class="btn-text">Continue Shopping</span>
              <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m9 18 6-6-6-6"/>
              </svg>
            </span>
            <div class="btn-border-glow"></div>
          </a>
        </div>
      </div>

      <!-- Right Column: Animated Visual Scene -->
      <div class="col-lg-6 col-md-12 scene-section d-flex align-items-center justify-content-center position-relative">
        <div class="showroom-scene-wrapper">
          
          <!-- Volumetric Light Beam from Floor Lamp (Easter Egg) -->
          <div class="volumetric-light-beam" [class.visible]="lampOn()"></div>

          <!-- Glassmorphic Floating 404 Numbers -->
          <div class="glass-digits-container parallax-layer" data-depth="0.15">
            <div class="digit digit-4">4</div>
            <div class="digit-separator">
              <div class="separator-line"></div>
            </div>
            <div class="digit digit-0">0</div>
            <div class="digit-separator">
              <div class="separator-line"></div>
            </div>
            <div class="digit digit-4">4</div>
          </div>

          <!-- Ambient Lighting Spot (Floor Lamp glow center) -->
          <div class="lamp-ambient-glow" [class.glowing]="lampOn()"></div>

          <!-- FURNITURE ELEMENTS (Parallax Layered and Interactive) -->
          
          <!-- 1. Interactive Floor Lamp (Click to Toggle Light) -->
          <div class="floating-furniture item-lamp parallax-layer" 
               data-depth="-0.2"
               [class.interactive-active]="lampOn()"
               (click)="toggleLamp($event)"
               tabindex="0"
               (keydown.enter)="toggleLamp($event)"
               title="Floor Lamp - Click to toggle light source"
               aria-label="Interactive Floor Lamp. Click to toggle lighting.">
            
            <div class="furniture-glow"></div>
            <svg class="furniture-svg svg-lamp" viewBox="0 0 100 200" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Base -->
              <path d="M30 190 H70" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
              <path d="M40 190 C40 185, 60 185, 60 190 Z" fill="currentColor"/>
              
              <!-- Stem -->
              <path d="M50 185 V70" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              
              <!-- Arc Arm -->
              <path d="M50 70 C50 30, 85 30, 85 60" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
              
              <!-- Shade -->
              <path d="M72 75 L98 75 L90 60 L80 60 Z" fill="currentColor" stroke="currentColor" stroke-width="2"/>
              <!-- Bulb / Core -->
              <circle cx="85" cy="76" r="5" fill="#f59e0b" class="lamp-bulb"/>
              
              <!-- Light rays outline when active -->
              <path d="M85 78 L65 140 M85 78 L105 140" stroke="#b8935c" stroke-width="1.5" stroke-dasharray="4,4" class="lamp-rays"/>
            </svg>
            <div class="hologram-ring"></div>
            <div class="tooltip-hint">Click Me</div>
          </div>

          <!-- 2. Interactive Lounge Chair (Click to Spin) -->
          <div class="floating-furniture item-chair parallax-layer" 
               data-depth="0.35"
               [class.spin-animation]="chairSpinned()"
               (click)="spinChair($event)"
               tabindex="0"
               (keydown.enter)="spinChair($event)"
               title="Lounge Chair - Click to spin"
               aria-label="Interactive Lounge Chair. Click to spin.">
            
            <div class="furniture-glow"></div>
            <svg class="furniture-svg svg-chair" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Backrest -->
              <rect x="25" y="15" width="50" height="40" rx="10" fill="none" stroke="currentColor" stroke-width="3"/>
              <line x1="35" y1="25" x2="65" y2="25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="35" y1="35" x2="65" y2="35" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="35" y1="45" x2="65" y2="45" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              
              <!-- Seat cushion -->
              <rect x="20" y="55" width="60" height="12" rx="6" fill="currentColor" stroke="currentColor" stroke-width="3"/>
              
              <!-- Armrests -->
              <path d="M22 45 C15 45, 18 58, 20 62" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M78 45 C85 45, 82 58, 80 62" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
              
              <!-- Swivel Base -->
              <line x1="50" y1="67" x2="50" y2="82" stroke="currentColor" stroke-width="4"/>
              <path d="M30 85 L70 85" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              <path d="M50 82 L35 90 M50 82 L65 90" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <div class="hologram-ring"></div>
            <div class="tooltip-hint">Click Me</div>
          </div>

          <!-- 3. Interactive Luxury Sofa (Click to Float/Bounce) -->
          <div class="floating-furniture item-sofa parallax-layer" 
               data-depth="0.2"
               [class.bounce-animation]="sofaFloated()"
               (click)="floatSofa($event)"
               tabindex="0"
               (keydown.enter)="floatSofa($event)"
               title="Luxury Sofa - Click to float higher"
               aria-label="Interactive Sofa. Click to float.">
            
            <div class="furniture-glow"></div>
            <svg class="furniture-svg svg-sofa" viewBox="0 0 160 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Back cushions -->
              <rect x="20" y="25" width="60" height="35" rx="8" fill="none" stroke="currentColor" stroke-width="3"/>
              <rect x="80" y="25" width="60" height="35" rx="8" fill="none" stroke="currentColor" stroke-width="3"/>
              
              <!-- Main seating deck -->
              <rect x="15" y="60" width="130" height="18" rx="6" fill="currentColor" stroke="currentColor" stroke-width="3"/>
              
              <!-- Armrests -->
              <rect x="10" y="45" width="12" height="32" rx="4" fill="currentColor" stroke="currentColor" stroke-width="2"/>
              <rect x="138" y="45" width="12" height="32" rx="4" fill="currentColor" stroke="currentColor" stroke-width="2"/>
              
              <!-- Sleek metal legs -->
              <line x1="25" y1="78" x2="20" y2="92" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              <line x1="135" y1="78" x2="140" y2="92" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              <line x1="80" y1="78" x2="80" y2="92" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="hologram-ring"></div>
            <div class="tooltip-hint">Click Me</div>
          </div>

          <!-- 4. Coffee Table (Mouse Hover Parallax Effect) -->
          <div class="floating-furniture item-table parallax-layer" 
               data-depth="0.45"
               (mouseenter)="setTableHover(true)"
               (mouseleave)="setTableHover(false)"
               [class.hover-active]="tableHovered()"
               aria-label="Designer coffee table floating in space.">
            
            <div class="furniture-glow"></div>
            <svg class="furniture-svg svg-table" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Table top (Glassmorphic) -->
              <ellipse cx="60" cy="35" rx="45" ry="12" fill="rgba(255,255,255,0.1)" stroke="currentColor" stroke-width="3"/>
              <ellipse cx="60" cy="35" rx="40" ry="9" stroke="currentColor" stroke-width="1" stroke-dasharray="3,3"/>
              
              <!-- Wooden legs base structure -->
              <line x1="40" y1="42" x2="25" y2="70" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="80" y1="42" x2="95" y2="70" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
              <line x1="60" y1="44" x2="60" y2="72" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M35 55 L85 55" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>

          <!-- 5. Interactive Floating Shelf (Click to Spin / Flip) -->
          <div class="floating-furniture item-shelf parallax-layer" 
               data-depth="0.1"
               [class.flip-animation]="shelfFlipped()"
               (click)="flipShelf($event)"
               tabindex="0"
               (keydown.enter)="flipShelf($event)"
               title="Wall Shelf - Click to flip items"
               aria-label="Interactive Shelf. Click to flip.">
            
            <div class="furniture-glow"></div>
            <svg class="furniture-svg svg-shelf" viewBox="0 0 130 80" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Shelf boards -->
              <line x1="15" y1="45" x2="115" y2="45" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
              
              <!-- Shelf brackets -->
              <path d="M30 45 V65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M100 45 V65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              
              <!-- Decorative items on shelf -->
              <!-- Minimalist plant pot & leaves -->
              <rect x="25" y="25" width="16" height="18" rx="2" fill="currentColor"/>
              <path d="M33 22 Q30 10 24 15 M33 22 Q38 8 44 14 M33 22 Q33 5 33 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
              
              <!-- Glass vase structure -->
              <path d="M85 43 L93 25 C94 20, 88 18, 86 18 C84 18, 78 20, 79 25 Z" stroke="currentColor" stroke-width="2" fill="none"/>
              <circle cx="86" cy="35" r="4" fill="currentColor"/>
              
              <!-- Diagonal books -->
              <rect x="52" y="20" width="8" height="23" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
              <rect x="63" y="21" width="8" height="23" rx="1" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(15 63 21)"/>
            </svg>
            <div class="hologram-ring"></div>
            <div class="tooltip-hint">Click Me</div>
          </div>

          <!-- Glassmorphic Showroom Floor Base Grid -->
          <div class="room-floor-grid">
            <div class="grid-radial-mask"></div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Soft vignette border framing the experience -->
  <div class="screen-vignette"></div>

</div>
